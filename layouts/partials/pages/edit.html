<header class="app-header">
  <button id="btn-back-settings" class="btn btn-back" data-href="{{ "settings/" | relURL }}">
    <span aria-hidden="true">←</span> Zurück
  </button>
  <h1 id="edit-event-name">Artikel bearbeiten</h1>
</header>

<div id="edit-error" class="error-page" hidden>
  <p>Veranstaltung nicht gefunden.</p>
  <a href="settings/" class="btn btn-secondary">← Zurück zu Einstellungen</a>
</div>

<main id="edit-content" class="setup-main" hidden>
  <section class="setup-section">
    <h2 class="section-title">Artikel hinzufügen</h2>

    <div class="item-form">
      <label for="item-name" class="field-label">Artikelname</label>
      <input
        id="item-name"
        type="text"
        class="text-input"
        placeholder="Artikelname"
        autocomplete="off"
      >
      <label for="item-price" class="field-label">Preis (€)</label>
      <input
        id="item-price"
        type="number"
        class="text-input"
        placeholder="Preis (€)"
        step="0.01"
      >
      <div class="color-row">
        <label for="item-color" class="field-label">Farbe</label>
        <input id="item-color" type="color" value="#cccccc" class="color-input">
      </div>
      <button id="btn-add-item" class="btn btn-secondary">+ Artikel</button>
    </div>

    <div id="setup-items-list" class="setup-items-list"></div>
  </section>

  <section class="setup-section share-section">
    <h2 class="section-title">Mit anderen Geräten teilen</h2>
    <p class="section-hint">
      Der Link öffnet „Neue Veranstaltung" mit diesen Artikeln, ideal für alle, die mitkassieren.
    </p>
    <div class="export-row">
      <button id="btn-share-link" class="btn btn-primary btn-full">Link teilen</button>
      <button id="btn-export" class="btn btn-secondary btn-full">Als Datei exportieren ↓</button>
    </div>
    <label for="share-link" class="field-label" hidden id="share-link-label">Link zum Kopieren</label>
    <input id="share-link" type="text" class="text-input" readonly hidden>
    <p id="share-status" class="info-text" aria-live="polite"></p>
  </section>
</main>
