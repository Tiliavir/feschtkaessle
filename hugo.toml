baseURL = '/'
locale = 'de'
title = 'Feschtkässle'
enableRobotsTXT = true
disableKinds = ['taxonomy', 'term', 'RSS']
assetDir = 'assets'

[build]
  [[build.cachebusters]]
    source = 'assets/(?:scss|ts)/'
    target = 'css|js'

  [build.js]
    minify = true
    target = 'es2020'
    format = 'iife'
    treeShaking = true

[params]
  description = 'Die einfache Kasse für Vereine & Feste'
  author = 'Markus Lindenmann'
  # Shared feedback endpoint (Tiliavir/public-feedback, see docs/feedback.md). Empty: no feedback entry in the app.
  feedbackEndpoint = ''
